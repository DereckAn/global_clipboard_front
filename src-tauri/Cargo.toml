[package]
name = "global_clipboard"
version = "0.1.0"
description = "A Tauri App"
authors = ["Dereck Angeles"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "global_clipboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lazy_static = "1.5"
palette = "0.7"
reqwest = { version = "0.11", features = ["blocking"] }
scraper = "0.17"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Clipboard accessk
arboard = "3.4"

# UUID generation
uuid = { version = "1.10", features = ["v4", "serde"] }

# Async runtime (para el monitor del clipboard)
tokio = { version = "1", features = ["full"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-global-shortcut = "2.3.1"

# Dependencias específicas por plataforma
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
"Win32_Foundation",
"Win32_UI_WindowsAndMessaging",
"Win32_Graphics_Dwm",
] }
