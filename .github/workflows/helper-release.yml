name: Build screenshot helper

on:
  push:
    tags:
      - "helper-v*"
  workflow_dispatch:

jobs:
  helper:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-13
            target: x86_64-apple-darwin
            suffix: macos-x64
            ext: ""
          - os: macos-14
            target: aarch64-apple-darwin
            suffix: macos-arm64
            ext: ""
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64
            ext: ""
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: linux-arm64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x64
            ext: ".exe"
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            suffix: windows-arm64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: helper-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Build helper
        run: |
          cd src-tauri
          cargo build --release --bin screenshot-helper --target=${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          cd src-tauri/target/${{ matrix.target }}/release
          cp screenshot-helper${{ matrix.ext }} screenshot-helper-${{ matrix.suffix }}${{ matrix.ext }}
          shasum -a 256 screenshot-helper-${{ matrix.suffix }}${{ matrix.ext }} >SHA256-${{ matrix.suffix }}.txt

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/${{ matrix.target }}/release/screenshot-helper-${{ matrix.suffix }}${{ matrix.ext }}
            src-tauri/target/${{ matrix.target }}/release/SHA256-${{ matrix.suffix }}.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}