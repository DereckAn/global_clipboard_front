name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - app
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - app
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    name: Verify (check + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            curl \
            wget \
            file \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev \
            liblcms2-dev \
            libjpeg-dev

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Type check (Svelte)
        run: bun run check

      - name: Frontend tests (Vitest)
        run: bun run test:frontend

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        env:
          RUSTUP_HOME: ${{ runner.temp }}/rustup

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build-frontend:
    name: Build frontend bundle
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache-frontend.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute frontend hash
        id: frontend-hash
        run: |
          HASH=$(git ls-files \
            'src/**' \
            'package.json' \
            'bun.lock' \
            'svelte.config.js' \
            'vite.config.js' \
            'tsconfig.json' | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Restore cached build
        id: cache-frontend
        uses: actions/cache@v4
        with:
          path: build
          key: svelte-build-${{ steps.frontend-hash.outputs.hash }}
          restore-keys: |
            svelte-build-

      - name: Set up Bun
        if: steps.cache-frontend.outputs.cache-hit != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.cache-frontend.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Build frontend
        if: steps.cache-frontend.outputs.cache-hit != 'true'
        run: bun run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: build
          retention-days: 3

  build-tauri:
    name: Build desktop (${{ matrix.name }})
    needs: [tests, build-frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-intel
            os: macos-13
            target: x86_64-apple-darwin
          - name: macos-apple-silicon
            os: macos-14
            target: aarch64-apple-darwin
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: build

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        env:
          RUSTUP_HOME: ${{ runner.temp }}/rustup
        with:
          targets: ${{ matrix.target }}

      # Instalar dependencias de Linux
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev \
            liblcms2-dev \
            libjpeg-dev \
            pkg-config \
            build-essential \
            xdg-utils

      # Agregar target de Rust para Windows ARM64
      - name: Add Rust target for Windows ARM64
        if: matrix.target == 'aarch64-pc-windows-msvc'
        run: rustup target add aarch64-pc-windows-msvc

      - name: Cache cargo builds
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri app
        env:
          TAURI_SKIP_BUILD_FRONTEND: "true"
        run: bun run tauri build --target ${{ matrix.target }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**
          retention-days: 7

  release:
    name: Release artifacts
    needs: build-tauri
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        id: prepare
        run: |
          mkdir -p release-assets
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          copy_bundle() {
            target="$1"
            src_pattern="$2"
            dest_name="$3"
            dir="artifacts/tauri-${target}"
            if file=$(find "$dir" -type f -name "$src_pattern" 2>/dev/null | head -1); then
              cp "$file" "release-assets/${dest_name}"
              echo "✅ copied $(basename "$file") -> ${dest_name}"
            else
              echo "⚠️ missing artifact ${src_pattern} in ${dir}" >&2
            fi
          }

          copy_bundle "x86_64-apple-darwin" "*.dmg" "GlobalClipboard-${VERSION}-macOS-Intel.dmg"
          copy_bundle "aarch64-apple-darwin" "*.dmg" "GlobalClipboard-${VERSION}-macOS-AppleSilicon.dmg"
          copy_bundle "x86_64-pc-windows-msvc" "*x64_en-US.msi" "GlobalClipboard-${VERSION}-Windows-x64.msi"
          copy_bundle "x86_64-pc-windows-msvc" "*x64-setup.exe" "GlobalClipboard-${VERSION}-Windows-x64-Setup.exe"
          copy_bundle "aarch64-pc-windows-msvc" "*arm64_en-US.msi" "GlobalClipboard-${VERSION}-Windows-arm64.msi"
          copy_bundle "aarch64-pc-windows-msvc" "*arm64-setup.exe" "GlobalClipboard-${VERSION}-Windows-arm64-Setup.exe"
          copy_bundle "x86_64-unknown-linux-gnu" "*.AppImage" "GlobalClipboard-${VERSION}-Linux-x64.AppImage"
          copy_bundle "x86_64-unknown-linux-gnu" "*.deb" "GlobalClipboard-${VERSION}-Linux-x64.deb"
          copy_bundle "x86_64-unknown-linux-gnu" "*.rpm" "GlobalClipboard-${VERSION}-Linux-x64.rpm"
          copy_bundle "aarch64-unknown-linux-gnu" "*.AppImage" "GlobalClipboard-${VERSION}-Linux-arm64.AppImage"
          copy_bundle "aarch64-unknown-linux-gnu" "*arm64.deb" "GlobalClipboard-${VERSION}-Linux-arm64.deb"
          copy_bundle "aarch64-unknown-linux-gnu" "*aarch64.rpm" "GlobalClipboard-${VERSION}-Linux-arm64.rpm"

          (cd release-assets && sha256sum * > SHA256SUMS 2>/dev/null || true)

      - name: Generate release notes
        id: notes
        run: |
          VERSION=${{ steps.prepare.outputs.version }}
          TAG=${GITHUB_REF#refs/tags/}
          REPO=${{ github.repository }}
          cat > body.md <<'EOF'

          | Platform | Architecture | Download |
          |----------|-------------|----------|
          | Windows | x64 | [GlobalClipboard_${VERSION}_x64-setup.exe](https://github.com/${REPO}/releases/download/${TAG}/GlobalClipboard-${VERSION}-Windows-x64-Setup.exe) / [.msi](https://github.com/${REPO}/releases/download/${TAG}/GlobalClipboard-${VERSION}-Windows-x64.msi) |
          | Windows | ARM64 | [GlobalClipboard_${VERSION}_arm64-setup.exe](https://github.com/${REPO}/releases/download/${TAG}/GlobalClipboard-${VERSION}-Windows-arm64-Setup.exe) / [.msi](https://github.com/${REPO}/releases/download/${TAG}/GlobalClipboard-${VERSION}-Windows-arm64.msi) |
          | macOS | Intel | [GlobalClipboard_${VERSION}_x64.dmg](https://github.com/${REPO}/releases/download/${TAG}/GlobalClipboard-${VERSION}-macOS-Intel.dmg) |
          | macOS | Apple Silicon | [GlobalClipboard_${VERSION}_arm64.dmg](https://github.com/${REPO}/releases/download/${TAG}/GlobalClipboard-${VERSION}-macOS-AppleSilicon.dmg) |
          | Linux | x64 | [.AppImage](https://github.com/${REPO}/releases/download/${TAG}/GlobalClipboard-${VERSION}-Linux-x64.AppImage) / [.deb](https://github.com/${REPO}/releases/download/${TAG}/GlobalClipboard-${VERSION}-Linux-x64.deb) / [.rpm](https://github.com/${REPO}/releases/download/${TAG}/GlobalClipboard-${VERSION}-Linux-x64.rpm) / [.pkg.tar.zst](https://github.com/${REPO}/releases/download/${TAG}/GlobalClipboard-${VERSION}-Linux-x64.pkg.tar.zst) |
          | Linux | ARM64 | [.AppImage](https://github.com/${REPO}/releases/download/${TAG}/GlobalClipboard-${VERSION}-Linux-arm64.AppImage) / [.deb](https://github.com/${REPO}/releases/download/${TAG}/GlobalClipboard-${VERSION}-Linux-arm64.deb) / [.rpm](https://github.com/${REPO}/releases/download/${TAG}/GlobalClipboard-${VERSION}-Linux-arm64.rpm) / [.pkg.tar.zst](https://github.com/${REPO}/releases/download/${TAG}/GlobalClipboard-${VERSION}-Linux-arm64.pkg.tar.zst) |

          > **macOS**: si aparece el mensaje "app is damaged", ejecutar:
          > ```bash
          > sudo xattr -d com.apple.quarantine "/Applications/Global Clipboard.app"
          > ```
          EOF

          sed -i "s|\${VERSION}|${VERSION}|g" body.md
          sed -i "s|\${TAG}|${TAG}|g" body.md
          sed -i "s|\${REPO}|${REPO}|g" body.md
          echo "body<<'EOF'" >> "$GITHUB_OUTPUT"
          cat body.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false
